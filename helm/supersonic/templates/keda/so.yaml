{{- if .Values.keda.enabled }}

{{- $scaleUp := .Values.keda.scaleUp | default dict }}
{{- $scaleDown := .Values.keda.scaleDown | default dict }}
{{- $minReplicaCount := .Values.keda.minReplicaCount | int }}
{{- if eq (include "supersonic.scaleFromZeroEnabled" .) "true" }}
{{- $scaled_object := lookup "keda.sh/v1alpha1" "ScaledObject" .Release.Namespace (printf "%s-keda-so" (include "supersonic.name" .)) }}
{{- if $scaled_object }}
{{- $minReplicaCount = int (dig "spec" "minReplicaCount" $minReplicaCount $scaled_object) }}
{{- end }}
{{- end }}

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "supersonic.name" . }}-keda-so
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ include "supersonic.name" . }}
    app.kubernetes.io/component: keda
spec:
  scaleTargetRef:
    name: {{ include "supersonic.inferenceServerName" . }}
    kind: Deployment
  {{- /* 0 is not a valid polling interval; fall back to the default. */}}
  pollingInterval: {{ .Values.keda.pollingInterval | default 10 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
{{- if (eq .Values.keda.zeroIdleReplicas true) }}
  idleReplicaCount: 0
{{- end }}
  minReplicaCount: {{ $minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ dig "stabilizationWindowSeconds" 90 $scaleDown }}
          policies:
            - periodSeconds: {{ dig "periodSeconds" 15 $scaleDown }}
              type: Pods
              value: {{ dig "stepsize" 2 $scaleDown }}
        scaleUp:
          stabilizationWindowSeconds: {{ dig "stabilizationWindowSeconds" 0 $scaleUp }}
          policies:
            - periodSeconds: {{ dig "periodSeconds" 15 $scaleUp }}
              type: Pods
              value: {{ dig "stepsize" 2 $scaleUp }}

  triggers:
  - type: prometheus
    {{- /* AverageValue for the default metric, Value (per replica) for a custom one. */}}
    metricType: {{ .Values.keda.metricType | default (ternary "Value" "AverageValue" (ne .Values.serverLoadMetric "")) }}
    metadata:
      serverAddress: {{ include "supersonic.prometheusUrl" . }}
      metricName: autoscaler-metric
      threshold: {{ include "supersonic.defaultThreshold" . | quote }}
      {{- with .Values.keda.activationThreshold }}
      activationThreshold: {{ . | quote }}
      {{- end }}
      ignoreNullValues: "true"
      query: |-
        {{ include "supersonic.defaultMetric" . | nindent 8 }}
---

{{- end }}
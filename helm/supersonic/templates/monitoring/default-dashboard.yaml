{{- if .Values.grafana.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-default-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/component: grafana
data:
  default.json: |-
    {{- $dashboard := $.Files.Get "dashboards/default.json" | fromJson }}
    {{ $dashboard | toJson | nindent 4 }}
{{- end }}

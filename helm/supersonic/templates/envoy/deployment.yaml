{{- if .Values.envoy.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supersonic.envoyName" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ include "supersonic.name" . }}
    app.kubernetes.io/component: envoy
spec:
  replicas: {{ .Values.envoy.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ include "supersonic.name" . }}
      app.kubernetes.io/component: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ include "supersonic.name" . }}
        app.kubernetes.io/component: envoy
      {{- with .Values.envoy.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if eq (include "supersonic.scaleFromZeroEnabled" .) "true" }}
      serviceAccountName: {{ include "supersonic.envoyName" . }}
      {{- end }}
      containers:
      - name: envoy
        image: {{ .Values.envoy.image }}
        command:
          - sh
          - -c
          - |
            apt-get update -y
            apt-get install -y gettext-base
            envsubst < /etc/envoy/envoy.yaml > /tmp/envoy.yaml
            exec envoy -c /tmp/envoy.yaml
        args: {{ toYaml .Values.envoy.args | nindent 10 }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        {{- range .Values.envoy.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .port }}
        {{- end }}
        volumeMounts:
        - name: {{ include "supersonic.name" . }}-envoy-config
          mountPath: /etc/envoy
        {{- if (include "supersonic.luaFilterEnabled" .) }}
        - name: {{ include "supersonic.name" . }}-lua-volume
          mountPath: /etc/envoy/lua
          readOnly: true
        {{- end }}
        resources:
          {{ toYaml .Values.envoy.resources | nindent 10 }}
      {{- if eq (include "supersonic.scaleFromZeroEnabled" .) "true" }}
      {{- $sfz := .Values.scaleFromZero | default dict }}
      - name: admission
        image: {{ $sfz.admissionImage | default "python:3.11-slim" }}
        command: ["python3", "/app/admission-server.py"]
        env:
        - name: HOLD_MIN_REPLICAS_SECONDS
          value: {{ $sfz.holdMinReplicasSeconds | default 300 | quote }}
        - name: GPU_DEPLOYMENT
          value: {{ include "supersonic.tritonName" . | quote }}
        - name: SCALEDOBJECT_NAME
          value: {{ printf "%s-keda-so" (include "supersonic.name" .) | quote }}
        - name: IDLE_MIN_REPLICAS
          value: {{ .Values.keda.minReplicaCount | int | quote }}
        ports:
        - name: admission
          containerPort: 8080
        volumeMounts:
        - name: admission-config
          mountPath: /app
          readOnly: true
        readinessProbe:
          exec:
            command:
              - python3
              - -c
              - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      {{- end }}
      volumes:
      - name: {{ include "supersonic.name" . }}-envoy-config
        configMap:
          name: {{ include "supersonic.name" . }}-envoy-config
      {{- if (include "supersonic.luaFilterEnabled" .) }}
      - name: {{ include "supersonic.name" . }}-lua-volume
        configMap:
          name: {{ include "supersonic.name" . }}-lua-config
          items:
          - key: envoy-filter.lua
            path: envoy-filter.lua
      {{- end }}
      {{- if eq (include "supersonic.scaleFromZeroEnabled" .) "true" }}
      - name: admission-config
        configMap:
          name: {{ include "supersonic.envoyName" . }}-admission
      {{- end }}


{{- if .Values.envoy.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.envoy.nodeSelector | nindent 8 }}
{{- end }}
{{- if .Values.envoy.tolerations }}
      tolerations:
{{ toYaml .Values.envoy.tolerations | nindent 8 }}
{{- end }}
      restartPolicy: Always

---

{{- end }}
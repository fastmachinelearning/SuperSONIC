{{- if eq (include "supersonic.nereidEnabled" .) "true" }}
{{- /* Nereid reads nereid.yaml from its working directory and resolves
       server.ml_backends_path relative to it, so point ml_backends_path at
       the model repository mount path when models come from a volume. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supersonic.inferenceServerName" . }}-nereid-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ include "supersonic.name" . }}
    app.kubernetes.io/component: inference-server
data:
  nereid.yaml: |-
    {{- toYaml .Values.inferenceServer.nereid.config | nindent 4 }}
{{- end }}

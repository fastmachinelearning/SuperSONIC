apiVersion: batch/v1
kind: Job
metadata:
  name: perf-analyzer-job
  namespace: cms
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: perf-analyzer
        image: python:3.14-slim
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            # perf_analyzer from the PyPI wheel is dynamically linked against libstdc++,
            # which python:*-slim does not ship (libssl3 and zlib1g are already present).
            apt-get update -qq && apt-get install -y -qq --no-install-recommends libstdc++6 > /dev/null
            pip install --quiet --no-cache-dir "tritonclient[grpc]==2.72.0" "perf-analyzer==2.60.0"
            echo "Sending RepositoryIndex to scale Triton from zero..."
            python3 -c '
            import tritonclient.grpc as grpcclient
            client = grpcclient.InferenceServerClient("supersonic.cms.svc.cluster.local:8001")
            print(client.get_model_repository_index(client_timeout=400))
            '
            echo "Running perf_analyzer..."
            perf_analyzer -i grpc \
                          -m higgsInteractionNet \
                          -u supersonic.cms.svc.cluster.local:8001 \
                          --async -p 1 -b 100  --measurement-interval=5000 \
                          --concurrency-range=1:1 --input-data "random"